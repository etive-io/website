# The asimov plugin registry.
#
# This is the ONLY hand-maintained list of ecosystem packages. To list a new
# plugin, open a pull request adding an entry below. Everything else on the
# site -- description, version, licence, Python support, the asimov entry
# points the package registers, conda-forge availability, README and releases
# -- is fetched automatically from PyPI and the repository when the site is
# built (scripts/build-registry.py). Keep your package metadata up to date
# there, not here.
#
# Fields
#   name         (required) display name; usually the PyPI name
#   repo         (required) "owner/name" on GitHub, or a full https URL for
#                a GitLab instance (e.g. https://git.ligo.org/group/project)
#   category     (required) core | parameter-estimation | data | search |
#                post-processing | population | simulation | integration |
#                other-domains
#   pypi         PyPI name if it differs from `name`; `null` if not on PyPI
#   conda        conda-forge name if it differs from the PyPI name
#   maintenance  official (asimov team) | community   [default: community]
#   docs         documentation URL (defaults to the repository homepage)
#   summary      one-line override if the PyPI/repository description is poor
#   featured     true to show on the homepage
#   deprecated   short reason, shown as a warning (archived repos are
#                flagged automatically)

- name: asimov
  repo: etive-io/asimov
  category: core
  maintenance: official
  summary: Workflow infrastructure for automated, recorded and reproducible scientific analysis.
  docs: https://asimov.docs.ligo.org/asimov/

