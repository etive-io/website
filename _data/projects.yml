# Project data for etive.io website
# This file contains information about all projects in the asimov ecosystem
#
# Fields:
#   name: Project name (required)
#   description: Full description for documentation pages (required)
#   short_description: Concise description for releases page and homepage (required)
#   github_url: GitHub repository URL (required)
#   docs_url: Documentation URL (required)
#   featured_on_homepage: Boolean, set to true to display on homepage ecosystem section (optional)
#   git_label: Custom label for git link (optional, defaults to "GitHub")

# Core asimov ecosystem projects
core_projects:
  - name: asimov
    description: The main framework for managing gravitational-wave parameter estimation analyses across multiple pipelines.
    short_description: Main framework for managing gravitational-wave parameter estimation analyses
    github_url: https://github.com/etive-io/asimov
    docs_url: https://asimov.docs.ligo.org/asimov/
    
  - name: asimov-gwdata
    description: Data handling utilities for gravitational-wave analysis, including data discovery, download, and quality checks.
    short_description: Data handling utilities for gravitational-wave analysis
    github_url: https://github.com/etive-io/asimov-gwdata
    docs_url: https://github.com/etive-io/asimov-gwdata#readme
    featured_on_homepage: true

  - name: asimov-gracedb
    description: GraceDB integration for asimov, providing event and superevent lookup without making ligo-gracedb a core dependency of the base package.
    short_description: GraceDB integration for asimov
    github_url: https://github.com/etive-io/asimov-gracedb
    docs_url: https://github.com/etive-io/asimov-gracedb#readme

# Pipeline interface projects
pipeline_interfaces:
  - name: asimov-pycbc
    description: Interface between asimov and PyCBC for running parameter estimation with PyCBC inference.
    short_description: Interface between asimov and PyCBC
    github_url: https://github.com/etive-io/asimov-pycbc
    docs_url: https://github.com/etive-io/asimov-pycbc#readme

  - name: asimov-cogwheel
    description: Interface between asimov and cogwheel for efficient likelihood calculations using relative binning.
    short_description: Interface between asimov and cogwheel
    github_url: https://github.com/etive-io/asimov-cogwheel
    docs_url: https://github.com/etive-io/asimov-cogwheel#readme

  - name: asimov-bayeswave
    description: Interface between asimov and BayesWave for on-source power spectral density (PSD) estimation.
    short_description: Interface between asimov and BayesWave for PSD estimation
    github_url: https://github.com/etive-io/asimov-bayeswave
    docs_url: https://etive-io.github.io/asimov-bayeswave/

  - name: asimov-lalinference
    description: Interface between asimov and LALInference. Superseded by bilby and RIFT; retained for cross-checks and for replicating older analyses, not for new collaboration parameter estimation.
    short_description: Interface between asimov and LALInference (legacy pipeline)
    github_url: https://github.com/etive-io/asimov-lalinference
    docs_url: https://etive-io.github.io/asimov-lalinference/

  - name: asimov-pesummary
    description: Interface between asimov and PESummary for post-processing, summarising, and visualising parameter estimation results.
    short_description: Interface between asimov and PESummary for PE post-processing
    github_url: https://github.com/etive-io/asimov-pesummary
    docs_url: https://etive-io.github.io/asimov-pesummary/

# Supported analysis pipelines
supported_pipelines:
  - name: bilby
    description: A Bayesian inference library for gravitational-wave astronomy and beyond.
    github_url: https://github.com/bilby-dev/bilby
    docs_url: https://lscsoft.docs.ligo.org/bilby/
    short_description: A Bayesian inference library for gravitational-wave astronomy
    
  - name: PyCBC
    description: Python toolkit for analysis of data from gravitational-wave laser interferometer detectors.
    github_url: https://github.com/gwastro/pycbc
    docs_url: https://pycbc.org/
    short_description: Python toolkit for analysis of gravitational-wave data
    
  - name: cogwheel
    description: Efficient likelihood calculations using relative binning for gravitational-wave parameter estimation.
    github_url: https://github.com/jroulet/cogwheel
    docs_url: https://cogwheel.readthedocs.io/
    short_description: Efficient likelihood calculations for gravitational-wave signals
    
  - name: LALInference
    description: LIGO Algorithm Library inference package for Bayesian parameter estimation.
    github_url: https://github.com/lscsoft/lalsuite
    docs_url: https://lscsoft.docs.ligo.org/lalsuite/
    short_description: LIGO Algorithm Library inference package
    
  - name: BayesWave
    description: Bayesian algorithm for detecting and characterizing gravitational-wave signals in noisy data.
    github_url: https://git.ligo.org/lscsoft/bayeswave
    docs_url: https://git.ligo.org/lscsoft/bayeswave/-/blob/master/README.md
    short_description: Bayesian algorithm for detecting and characterizing gravitational-wave signals
    git_label: LIGO Git
